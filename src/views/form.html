<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generate Website Pages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/logo-shape-picker.css">
  <!-- The business type picker on step 1. Layout only; every colour in it
       comes from Bootstrap classes this page already loads. -->
  <link rel="stylesheet" href="/business-type-picker.css">

  <!-- The header's stylesheet and CSS. Filled by routes/formRoute.js from
       utils/appHeader.js — the SAME source the dashboard and the build page
       use, so there is exactly one place to edit the header.

       This is where the bootstrap-icons link and the .header-background /
       .padding-right-header rules used to be written out by hand. -->
  {{HEADER_ASSETS}}

 
  <style>
    body{
      background: #082d5b;;
    }

    /* The header's own rules moved to utils/appHeader.js on 21 September and
       arrive from the assets placeholder near the top of this head. They were
       the bare "header" rule, ".padding-right-header" and
       ".header-background". Do not add header styling back here — it would
       apply to this page only, and the dashboard and the build page would
       quietly look different.

       NOTE: do not write a placeholder name in a comment. The substitution in
       formRoute.js is a global regex, so a mention inside a comment is filled
       in too — which is how this very comment once injected a second copy of
       the whole header stylesheet into the middle of this <style> block. */

    .card {
      border: none;
      background: none;
      margin-bottom:20px !important;
    }

    .card .mt-4 {
      margin-top: 0px !important;
    }

    .outer-card {
      box-shadow: 10px 10px 10px black;

    }
    .btnHover:hover{
      background: rgb(24, 148, 24) !important;
    }

    .btnHoverBack:hover{
      background: rgb(15, 127, 179) !important;
    }
    .border-card{
      border: none;
      
    }
    .btn-dark{
      color:white;
    }
    
    input[type=text],
    input[type=tel],
    input[type=email],
    input[type=url],
    input[type=file] {
      background:#e4e6e7;
    }

    .card-header {
      background:#082d5b; 
    }

    .card-body h3,
    label,
    strong,
    p,
    h3,
    h4,
    .form-text,
    legend,
    h5, hr {
      color: white;
    }

    .card-body-bottom{
      margin-bottom: 30px;
    }
   
  </style>

</head>
<body>
  <!-- The app header. Filled by routes/formRoute.js from utils/appHeader.js,
       which is the SAME source the dashboard and the build page use.

       There is now exactly ONE place the header exists. Do not paste markup
       back in here: it would change this page only, and the other two would
       silently fall behind. -->
  {{HEADER}}
  {{SIDEBAR}}
  
  
  

  <!-- THE WIZARD CARD IS UNCHANGED. What changed is that it is no longer the
       only thing on the page: the empty column to its left now holds the
       tools nav from utils/appHeader.js, which is where Keyword Research and
       Blog Automation are reachable from. The card keeps its width and its
       markup; a column was added beside it. -->
  <div class="container mt-3">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="card border-card outer-card">
      
          <div class="card-body px-5 card-body-bottom">
            <!--  Alert message for errors -->
            <div id="formAlert"
                 class="alert alert-danger d-none alert-dismissible"
                 role="alert"
                 aria-live="polite">
              <span id="formAlertText"></span>
              <button type="button"
                class="btn-close"
                aria-label="Close"
                onclick="document.getElementById('formAlert').classList.add('d-none')">
              </button>
            </div>


            <!-- Form Start -->
            <form id="websiteForm" action="/generate" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
              <!-- Dynamic Sections Go Here -->
              <div id="dynamicFormContainer"></div>
            </form>
            <!-- Form End -->
          </div> <!-- End of Card Body -->
        </div>
      </div>
    </div>
  </div>


  <!-- Not Enough Credits Modal -->
  <div class="modal fade" id="creditsModal" tabindex="-1" aria-labelledby="creditsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header">
          <h5 class="modal-title" id="creditsModalLabel">Not Enough Credits</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="creditsModalMessage">
            You do not have enough credits to generate these pages.
          </p>
        </div>
        <div class="modal-footer">
          <a href="/buy-credits" class="btn btn-warning">Buy Credits</a>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>


  <!-- The header's scripts: bootstrap.bundle (the profile dropdown will not
       open without it) and currentUserInfo.js (fills the credits badge).
       Both used to be written out here by hand — bootstrap on this line,
       currentUserInfo at the bottom of the list.

       It stays FIRST because bootstrap.bundle is not deferred and the page's
       own scripts below are, so this preserves the original execution order. -->
  {{HEADER_SCRIPTS}}

  <!-- Before generateDinamycForm.js, which calls it. Both are deferred, and
       deferred scripts run in the order they appear. -->
  <script src="/js/businessTypePicker.js" defer></script>
  <script src="/js/hoursOfOperation.js" defer></script>
  <!-- load before your dynamic form builder so helpers are ready -->
  <script src="/js/locationPages.js" defer></script>
  <script src="/js/generateDinamycForm.js" defer></script>
  <script src="/js/spinner.js" defer></script>
</body>
</html>
