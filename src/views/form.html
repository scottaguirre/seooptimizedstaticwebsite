<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Three Comets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/logo-shape-picker.css">
  <!-- The business type picker on step 1. Layout only; every colour in it
       comes from Bootstrap classes this page already loads. -->
  <link rel="stylesheet" href="/business-type-picker.css">

  <!-- The header's stylesheet and CSS. Filled by routes/formRoute.js from
       utils/appHeader.js — the SAME source the dashboard and the build page
       use, so there is exactly one place to edit the header.

       This is where the bootstrap-icons link and the .header-background /
       .padding-right-header rules used to be written out by hand. -->
  {{HEADER_ASSETS}}

 
  <style>
    body{
      background: #082d5b;;
    }

    /* The header's own rules moved to utils/appHeader.js on 21 September and
       arrive from the assets placeholder near the top of this head. They were
       the bare "header" rule, ".padding-right-header" and
       ".header-background". Do not add header styling back here — it would
       apply to this page only, and the dashboard and the build page would
       quietly look different.

       NOTE: do not write a placeholder name in a comment. The substitution in
       formRoute.js is a global regex, so a mention inside a comment is filled
       in too — which is how this very comment once injected a second copy of
       the whole header stylesheet into the middle of this <style> block. */

    .card {
      border: none;
      background: none;
      margin-bottom:20px !important;
    }

    /* THE RULE THAT USED TO BE HERE:

         .card .mt-4 { margin-top: 0px !important; }

       Every element inside the wizard card carrying `mt-4` was one of the
       four Back/Next rows — nothing else on the page used the class. So a
       rule written to flatten spacing somewhere had, in practice, exactly
       one effect: it deleted the gap above the buttons on EVERY step, and
       `!important` meant the markup could not ask for it back.

       The result was Back and Generate sitting flush against the card above
       them, which on the Design and Review steps reads as though the buttons
       belong to the last card rather than to the step.

       A blanket override on a utility class is the wrong tool: `mt-4` means
       "this element wants spacing", and a page-level rule that answers "no"
       for all of them cannot be argued with from the element. The nav now
       asks by name. */
    .wizard-nav {
      margin-top: 2rem;
    }

    .outer-card {
      box-shadow: 10px 10px 10px black;

    }
    .btnHover:hover{
      background: rgb(24, 148, 24) !important;
    }

    .btnHoverBack:hover{
      background: rgb(15, 127, 179) !important;
    }
    .border-card{
      border: none;
      
    }
    .btn-dark{
      color:white;
    }
    
    input[type=text],
    input[type=tel],
    input[type=email],
    input[type=url],
    input[type=file] {
      background:#e4e6e7;
    }

    .card-header {
      background:#082d5b; 
    }

    /* A HEADING CLASS BEATS A HEADING TAG, AND THAT COST TWO BUGS.
     *
     * This list was element selectors only — h3, h4, h5 — and twice in two
     * days a heading written as `<h4 class="h5">` or `<h1 class="h3">` came
     * out near-black on navy while the labels beside it were white.
     *
     * Bootstrap 5.3 sets `h1..h6, .h1..h6 { color: var(--bs-heading-color) }`
     * and that token resolves to `inherit`. A CLASS selector outranks an
     * ELEMENT one, so Bootstrap's rule won and the heading inherited
     * `.card`'s own near-black `--bs-body-color` instead of this white.
     *
     *     COLOURING BY TAG NAME IS ONE BOOTSTRAP CLASS AWAY FROM NOT
     *     APPLYING, AND NOTHING ANYWHERE SAYS SO.
     *
     * The classes are named here as well, so the pair always match. h1 and
     * h2 are in the list for the first time: nothing on this page used them
     * until the wizard got a heading saying which door you came in by, and
     * their absence is exactly why that heading was invisible. */
    .card-body h3,
    label,
    strong,
    p,
    h1, h2, h3, h4, h5, h6,
    .h1, .h2, .h3, .h4, .h5, .h6,
    .form-text,
    legend,
    hr {
      color: white;
    }

    /* EXCEPT INSIDE AN ALERT, WHICH BRINGS ITS OWN COLOUR.
     *
     * The list above is bare element selectors — strong, p, label, h4 —
     * applied to the whole page, so they reach inside anything. Bootstrap's
     * .alert-warning sets a dark amber on the alert BOX and lets the text
     * inherit it, and a rule matching a child DIRECTLY beats inheritance
     * from the parent whatever the specificity. So strong { color: white }
     * won inside the alert.
     *
     * The result: the headline of the "This replaces your current website"
     * panel was white on pale amber while the rest of the same sentence was
     * dark — because only the <strong> was matched by name.
     *
     * `inherit` RATHER THAN A COLOUR, so each alert keeps whatever its own
     * variant defines: amber for warning, red for danger, green for success.
     * Naming a colour here would mean updating this rule every time a
     * different variant is used. */
    .alert strong,
    .alert label,
    .alert p,
    .alert h1, .alert h2, .alert h3,
    .alert h4, .alert h5, .alert h6,
    .alert .h1, .alert .h2, .alert .h3,
    .alert .h4, .alert .h5, .alert .h6,
    .alert .form-text,
    .alert legend {
      color: inherit;
    }

    .card-body-bottom{
      margin-bottom: 30px;
    }
   
  </style>

</head>
<body>
  <!-- The app header. Filled by routes/formRoute.js from utils/appHeader.js,
       which is the SAME source the dashboard and the build page use.

       There is now exactly ONE place the header exists. Do not paste markup
       back in here: it would change this page only, and the other two would
       silently fall behind. -->
  {{HEADER}}
  {{SIDEBAR}}
  
  
  

  <!-- THE WIZARD CARD IS UNCHANGED. What changed is that it is no longer the
       only thing on the page: the empty column to its left now holds the
       tools nav from utils/appHeader.js, which is where Keyword Research and
       Blog Automation are reachable from. The card keeps its width and its
       markup; a column was added beside it. -->
  <div class="container mt-3">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="card border-card outer-card">
      
          <div class="card-body px-5 card-body-bottom">

            <!-- WHICH DOOR YOU CAME IN BY, filled by routes/formRoute.js.
                 One wizard serves three routes and, until 17 November, said
                 so nowhere: the page opened on "1. What are we building?"
                 whether you had pressed Websites, GitHub Websites or
                 Cloudflare Websites, and the only difference visible
                 anywhere was which sidebar row was lit.

                 SERVER-RENDERED, NOT WRITTEN BY THE WIZARD. The title is
                 per-request and this file is static, which is the same
                 reason the CSRF token and the mode travel in meta tags. It
                 also means the heading is correct in the HTML as it
                 arrives, rather than appearing a frame later.

                 The marker below is substituted by a GLOBAL regex, so it
                 must not be named anywhere else in this file — including
                 in a comment. See the note at the top of the stylesheet
                 about the time that injected a second header. -->
            {{WIZARD_TITLE}}

            <!--  Alert message for errors -->
            <div id="formAlert"
                 class="alert alert-danger d-none alert-dismissible"
                 role="alert"
                 aria-live="polite">
              <span id="formAlertText"></span>
              <button type="button"
                class="btn-close"
                aria-label="Close"
                onclick="document.getElementById('formAlert').classList.add('d-none')">
              </button>
            </div>


            <!-- Form Start -->
            <form id="websiteForm" action="/generate" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
              <!-- Dynamic Sections Go Here -->
              <div id="dynamicFormContainer"></div>
            </form>
            <!-- Form End -->
          </div> <!-- End of Card Body -->
        </div>
      </div>
    </div>
  </div>


  <!-- Not Enough Credits Modal -->
  <div class="modal fade" id="creditsModal" tabindex="-1" aria-labelledby="creditsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header">
          <h5 class="modal-title" id="creditsModalLabel">Not Enough Credits</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="creditsModalMessage">
            You do not have enough credits to generate these pages.
          </p>
        </div>
        <div class="modal-footer">
          <a href="/buy-credits" class="btn btn-warning">Buy Credits</a>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>


  <!-- The header's scripts: bootstrap.bundle (the profile dropdown will not
       open without it) and currentUserInfo.js (fills the credits badge).
       Both used to be written out here by hand — bootstrap on this line,
       currentUserInfo at the bottom of the list.

       It stays FIRST because bootstrap.bundle is not deferred and the page's
       own scripts below are, so this preserves the original execution order. -->
  {{HEADER_SCRIPTS}}

  <!-- Before generateDinamycForm.js, which calls it. Both are deferred, and
       deferred scripts run in the order they appear. -->
  <script src="/js/businessTypePicker.js" defer></script>
  <!-- The page renderer's own hours formatter, loaded in the browser so the
       form's preview and the published site cannot word a day differently. -->
  <script src="/js/hoursFormat.js" defer></script>
  <script src="/js/hoursOfOperation.js" defer></script>
  <!-- load before your dynamic form builder so helpers are ready -->
  <script src="/js/locationPages.js" defer></script>
  <script src="/js/generateDinamycForm.js" defer></script>
  <script src="/js/spinner.js" defer></script>
</body>
</html>
